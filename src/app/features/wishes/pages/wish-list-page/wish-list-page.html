<section class="wish-list-page">
  <header>
    <h2>Wishes</h2>

    <button type="button" [disabled]="isLoading()" (click)="loadWishes()">
      {{ isLoading() ? 'Refreshing...' : 'Refresh' }}
    </button>
  </header>

  <app-category-create-form
    [fieldErrors]="categoryFieldErrors()"
    [resetKey]="categoryFormResetKey()"
    (createCategory)="createCategory($event)"
  />

  @if (categoryErrorMessage()) {
    <p>{{ categoryErrorMessage() }}</p>
  }

  <app-wish-create-form
    [categories]="categories()"
    [editingWish]="editingWish()"
    [fieldErrors]="createFieldErrors()"
    [isSaving]="isSavingWish()"
    (saveWish)="saveWish($event)"
  />

  @if (errorMessage()) {
    <p>{{ errorMessage() }}</p>
  }

  @if (isLoading()) {
    <p>Loading wishes...</p>
  } @else if (wishes().length === 0) {
    <p>No wishes yet.</p>
  } @else {
    <div>
      @for (wish of wishes(); track wish.id) {
        <app-wish-card
          [wish]="wish"
          [actionsDisabled]="isSavingWish()"
          [isDeleting]="deletingWishIds().has(wish.id)"
          (editWish)="startEdit($event)"
          (deleteWish)="deleteWish($event)"
        />
      }
    </div>
  }
</section>

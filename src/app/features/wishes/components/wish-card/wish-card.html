<article class="wish-card" [attr.aria-busy]="isUpdatingStatus()">
  <h3>{{ wish().wishName }}</h3>

  <p>Category: {{ wish().categoryName }}</p>
  <p>Price: {{ wish().wishPrice }}</p>
  <p>Priority: {{ wish().priority }}</p>
  <p>Status: {{ wish().status }}</p>

  @if (wish().url) {
    <a [href]="wish().url" target="_blank" rel="noopener noreferrer">
      Open link
    </a>
  }

  <button type="button" [disabled]="areActionsDisabled()" (click)="requestDelete()">
    {{ isDeleting() ? 'Deleting...' : 'Delete' }}
  </button>

  <button type="button" [disabled]="areActionsDisabled()" (click)="requestEdit()">
    Edit
  </button>

  <button
    type="button"
    data-action="update-status"
    [disabled]="areActionsDisabled()"
    (click)="requestStatusUpdate()"
  >
    @if (isUpdatingStatus()) {
      Updating status...
    } @else {
      {{ wish().status === 'ACTIVE' ? 'Mark purchased' : 'Restore active' }}
    }
  </button>

  @if (statusError()) {
    <p class="status-error" role="alert">{{ statusError() }}</p>
  }
</article>
